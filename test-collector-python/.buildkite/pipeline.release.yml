# Monorepo release pipeline for test-collector-python, uploaded by the
# release dispatcher (.buildkite/pipeline.release.yml) running on the
# separate bktest-release Buildkite pipeline — never by CI: as a rehearsal
# when this project changes (no tag), and for real on a
# test-collector-python/vX.Y.Z tag. Injected by `ctg gather` from the ctg
# repo's overlay/ directory during the dry-run era; post-cutover this file
# is maintained here, in the monorepo. It replaces the source repo's
# .buildkite/pipeline.release.yml, and normalises the trigger from a
# "[release]" commit-message match to the prefixed tag convention every
# project shares (see D13 in ctg docs/decisions.md).
#
# Safety model (see docs/publishing.md in the ctg repo):
#   - The build step is side-effect-free: uv build + twine check + version
#     consistency. It runs on every rehearsal, so rehearsals exercise the
#     release code. It never sees RELEASE_EXECUTE (deliberately not
#     propagated into its container).
#   - The publish steps assume the IAM role (aws-buildkite-dev
#     oidc-buildkite-bktest-release.tf) and read the PyPI token from SSM;
#     the role trusts this pipeline on test-collector-python/v* tags only
#     (see the credential cut-over section of ctg docs/publishing.md).
#   - The publish steps exist only on an exact test-collector-python/vX.Y.Z
#     tag AND RELEASE_EXECUTE=true set on the build, behind a block step;
#     the release script independently re-checks both before twine upload.

agents:
  queue: hosted

env:
  AWS_DEFAULT_REGION: us-east-1

steps:
  - label: ":pypi: test-collector-python: build + rehearse release"
    key: python-build
    command: test-collector-python/.buildkite/steps/release
    plugins:
      - docker#v5.12.0:
          image: "python:3.13"
          environment:
            - BUILDKITE_TAG

  - block: ":rocket: Publish test-collector-python to PyPI?"
    key: python-confirm
    if: build.tag =~ /^test-collector-python\/v[0-9]+\.[0-9]+\.[0-9]+$/ && build.env("RELEASE_EXECUTE") == "true"

  - label: ":pypi: test-collector-python: publish to PyPI"
    if: build.tag =~ /^test-collector-python\/v[0-9]+\.[0-9]+\.[0-9]+$/ && build.env("RELEASE_EXECUTE") == "true"
    depends_on:
      - python-build
      - python-confirm
    env:
      # "The username to authenticate to the repository (package index) as"
      # — a no-op on PyPI with a token, set to suppress the prompt.
      TWINE_USERNAME: __token__
    command: test-collector-python/.buildkite/steps/release
    plugins:
      - aws-assume-role-with-web-identity#v1.2.0:
          role-arn: "arn:aws:iam::445615400570:role/pipeline-buildkite-bktest-release"
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug
            - build_branch
      - aws-ssm#v1.0.0:
          parameters:
            TWINE_PASSWORD: /pipelines/buildkite/bktest-release/pypi-api-token
      - docker#v5.12.0:
          image: "python:3.13"
          environment:
            - TWINE_USERNAME
            - TWINE_PASSWORD
            - BUILDKITE_TAG
            - RELEASE_EXECUTE
