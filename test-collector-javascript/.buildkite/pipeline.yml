# Monorepo pipeline for test-collector-javascript, uploaded by the
# top-level dispatcher when this project changes. Injected by `ctg gather`
# from the ctg repo's overlay/ directory during the dry-run era;
# post-cutover this file is maintained here, in the monorepo.
#
# Dry-run-safe: pure test steps only, derived from the source repo's
# buildkite.yaml.
#
# Jobs check out the monorepo root, so commands cd into this project.

agents:
  queue: hosted

steps:
  - group: ":javascript: test-collector-javascript"
    steps:
      - label: ":npm: npm {{matrix}} SDK 2 + 3 install compatibility"
        matrix:
          - "10"
          - "11"
        command:
          - "cd test-collector-javascript"
          - "npm install --global npm@{{matrix}}"
          - "node .buildkite/check-otel-installs.js"
          - "node .buildkite/check-vitest-otel-install.js npm"
          - "node .buildkite/check-vitest-otel-install.js npm 3"
        plugins:
          - docker#v3.7.0:
              image: node:22.15.0
              mount-buildkite-agent: false
      - label: ":npm: pnpm SDK 2 + 3 Vitest OTel packed install"
        command:
          - "cd test-collector-javascript"
          - "npm install --global pnpm@10"
          - "node .buildkite/check-vitest-otel-install.js pnpm"
          - "node .buildkite/check-vitest-otel-install.js pnpm 3"
        plugins:
          - docker#v3.7.0:
              image: node:22.15.0
              mount-buildkite-agent: false
      - label: ":jest: Tests"
        # The cypress e2e suite occasionally hits its 20s timeout
        # (observed on bktest build #31); a plain retry has always
        # cleared it.
        retry:
          automatic:
            - exit_status: "*"
              limit: 2
        command:
          - "cd test-collector-javascript"
          - "npm ci"
          - "node .buildkite/otel-lines.js 2"
          - "npx playwright install --with-deps chromium"
          - "node .buildkite/install-jest-otel-tools.js"
          - "EXPECTED_JEST_VERSION=29.7.0 npm test"
        plugins:
          - docker#v3.7.0:
              image: cypress/base:22.15.0
              # Prevent mounting the agent, otherwise BUILDKITE_JOB_ID and
              # BUILDKITE_BUILD_ID are passed through to the container and
              # mess up the CI detection — we want a clean process.env.
              mount-buildkite-agent: false
      - label: ":opentelemetry: OTel @latest canary (soft fail)"
        # Stable SDK 2 and 3 are hard failures below; this detects new lines.
        soft_fail: true
        command:
          - "cd test-collector-javascript"
          - "npm ci"
          - "node .buildkite/otel-lines.js latest"
          - "node .buildkite/install-jest-otel-tools.js"
          - "npx playwright install --with-deps chromium"
          - "EXPECTED_JEST_VERSION=29.7.0 npm test -- --runInBand otel e2e/playwright.test.js"
        plugins:
          - docker#v3.7.0:
              image: node:22.15.0
              mount-buildkite-agent: false
      - label: ":opentelemetry: OTel tests against the oldest OpenTelemetry versions the collector supports"
        # Pair the documented Node floor with the supported SDK minimums.
        command:
          - "cd test-collector-javascript"
          - "npm ci"
          - "node .buildkite/otel-lines.js floor"
          - "node .buildkite/install-jest-otel-tools.js"
          - "npx playwright install --with-deps chromium"
          - "EXPECTED_JEST_VERSION=29.7.0 npm test -- --runInBand util/otel e2e/jest-otel.test.js e2e/playwright.test.js"
        plugins:
          - docker#v3.7.0:
              image: node:18.19.0
              mount-buildkite-agent: false
      - label: ":opentelemetry: SDK 3 full suite + Jest 30"
        command:
          - "cd test-collector-javascript"
          - "npm ci"
          - "node .buildkite/otel-lines.js 3"
          - "node .buildkite/install-jest-otel-tools.js"
          - "npx playwright install --with-deps chromium"
          - "EXPECTED_JEST_VERSION=29.7.0 npm test -- --runInBand"
          - "npm pkg set 'devDependencies.jest=30.5.2' 'devDependencies.jest-environment-node=30.5.2' --include-workspace-root --workspace examples/jest"
          - "npm install --ignore-scripts --legacy-peer-deps"
          - "node .buildkite/otel-lines.js 3"
          - "node .buildkite/install-jest-otel-tools.js"
          - "EXPECTED_JEST_VERSION=30.5.2 npm test -- --runInBand e2e/jest-otel.test.js"
        plugins:
          - docker#v3.7.0:
              image: cypress/base:22.15.0
              mount-buildkite-agent: false
      - label: ":opentelemetry: SDK 3 Jest 30 synchronous native ESM"
        # Node 22.15 above uses the async loader; 24.9 enables Jest's sync graph.
        command:
          - "cd test-collector-javascript"
          - "npm ci"
          - "npm pkg set 'devDependencies.jest=30.5.2' 'devDependencies.jest-environment-node=30.5.2' --include-workspace-root --workspace examples/jest"
          - "npm install --ignore-scripts --legacy-peer-deps"
          - "node .buildkite/otel-lines.js 3"
          - "node .buildkite/install-jest-otel-tools.js"
          - "EXPECTED_JEST_VERSION=30.5.2 npm test -- --runInBand e2e/jest-otel.test.js --testNamePattern='runs the selected Jest version|ES module obtained'"
        plugins:
          - docker#v3.7.0:
              image: node:24.9.0
              mount-buildkite-agent: false
      - label: ":vitest: SDK 3 Vitest {{matrix}} OTel compatibility"
        matrix:
          - "4.0.11"
          - "^4"
          - "^5"
        command:
          - "cd test-collector-javascript"
          # Vite 7 satisfies all three versions; 4.0.11 does not accept Vite 8.
          - "npm pkg set 'devDependencies.vite=^7' --include-workspace-root --workspace examples/vitest"
          # An explicit install resolves ^4/^5 afresh instead of retaining the lockfile's version.
          - "npm install --ignore-scripts --legacy-peer-deps --save-dev 'vitest@{{matrix}}' --include-workspace-root --workspace examples/vitest"
          - "node .buildkite/otel-lines.js 3"
          - "npm test -- --runInBand e2e/vitest.test.js e2e/vitest-otel.test.js"
        plugins:
          - docker#v3.7.0:
              image: node:22.15.0
              mount-buildkite-agent: false
      - label: ":jest: Jest {{matrix}} OTel compatibility"
        # 28.1.3 checks that unsupported Jest warns and uploads nothing.
        # 29.7.0 and 30.x exercise real Express, GraphQL, Redis and pg clients
        # through Jest and the OTLP receiver, including alias/mock resolution,
        # environment selection, non-hoisted instrumentation and late children.
        matrix:
          - "28.1.3"
          - "29.7.0"
          - "30.5.2"
        command:
          - "cd test-collector-javascript"
          # npm otherwise keeps the lockfile's nested copies under
          # examples/jest, which may not match the requested version.
          - "npm pkg set 'devDependencies.jest={{matrix}}' 'devDependencies.jest-environment-node={{matrix}}' --workspace examples/jest"
          - "node -e 'const fs = require(\"fs\"); const lock = JSON.parse(fs.readFileSync(\"package-lock.json\")); for (const key of Object.keys(lock.packages)) if (key.startsWith(\"examples/jest/node_modules/\")) delete lock.packages[key]; fs.writeFileSync(\"package-lock.json\", JSON.stringify(lock))'"
          - "npm install --ignore-scripts --legacy-peer-deps"
          - "node .buildkite/install-jest-otel-tools.js"
          - "EXPECTED_JEST_VERSION={{matrix}} npm test -- --runInBand e2e/jest-otel.test.js"
        plugins:
          - docker#v3.7.0:
              image: node:22.15.0
              mount-buildkite-agent: false
      - label: ":playwright: Playwright {{matrix.version}} OTel compatibility"
        matrix:
          setup:
            version:
              - "1.41.2"
              - "latest"
          adjustments:
            - with:
                version: "latest"
              soft_fail: true
        command:
          - "cd test-collector-javascript"
          - "npm pkg set 'devDependencies.@playwright/test={{matrix.version}}' --include-workspace-root --workspace examples/playwright"
          - "npm install --ignore-scripts --legacy-peer-deps"
          - "npx playwright install --with-deps chromium"
          # The legacy JSON fixtures use Playwright's 1.42+ tag details argument.
          - "npm test -- --runInBand e2e/playwright.test.js --testNamePattern='OTel mode'"
        plugins:
          - docker#v3.7.0:
              image: node:22.15.0
              mount-buildkite-agent: false
      - label: ":vitest: Vitest {{matrix.version}} compatibility"
        matrix:
          setup:
            version:
              - "1.6.1"
              - "2.1.9"
              - "3.0.0"
              - "4.0.11"
              - "4.1.12"
              - "5.1.0"
              - "latest"
          adjustments:
            - with:
                version: "latest"
              soft_fail: true
        command:
          - "cd test-collector-javascript"
          - "npm pkg set 'devDependencies.vitest={{matrix.version}}' --include-workspace-root --workspace examples/vitest"
          - "npm install --ignore-scripts --legacy-peer-deps"
          - "npm test -- --runInBand e2e/vitest.test.js e2e/vitest-otel.test.js"
        plugins:
          - docker#v3.7.0:
              image: node:22.15.0
              mount-buildkite-agent: false
