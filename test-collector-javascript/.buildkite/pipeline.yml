# Monorepo pipeline for test-collector-javascript, uploaded by the
# top-level dispatcher when this project changes. Injected by `ctg gather`
# from the ctg repo's overlay/ directory during the dry-run era;
# post-cutover this file is maintained here, in the monorepo.
#
# Dry-run-safe: pure test steps only, derived from the source repo's
# buildkite.yaml.
#
# Jobs check out the monorepo root, so commands cd into this project.

agents:
  queue: hosted

steps:
  - group: ":javascript: test-collector-javascript"
    steps:
      - label: ":jest: Tests"
        # The cypress e2e suite occasionally hits its 20s timeout
        # (observed on bktest build #31); a plain retry has always
        # cleared it.
        retry:
          automatic:
            - exit_status: "*"
              limit: 2
        command:
          - "cd test-collector-javascript"
          - "npm ci"
          - "npx playwright install --with-deps chromium"
          - "npm test"
        plugins:
          - docker#v3.7.0:
              image: cypress/base:22.15.0
              # Prevent mounting the agent, otherwise BUILDKITE_JOB_ID and
              # BUILDKITE_BUILD_ID are passed through to the container and
              # mess up the CI detection — we want a clean process.env.
              mount-buildkite-agent: false
      - label: ":opentelemetry: OTel tests against the newest published OpenTelemetry SDK (soft fail: early warning that an SDK release broke the collector)"
        # The lockfile pins the SDK the collector was built against. This
        # step installs the newest versions the peer ranges allow, so a new
        # SDK release that breaks span export shows up here before a
        # customer finds it. It never fails the build.
        soft_fail: true
        command:
          - "cd test-collector-javascript"
          - "npm ci"
          - "node -e 'const peers = Object.entries(require(\"./package.json\").peerDependencies).map(([name, range]) => name + \"@\" + range); require(\"child_process\").execFileSync(\"npm\", [\"install\", \"--no-save\", ...peers], { stdio: \"inherit\" })'"
          - "npm ls @opentelemetry/api @opentelemetry/sdk-trace-base @opentelemetry/resources @opentelemetry/exporter-trace-otlp-proto"
          - "npm test -- otel"
        plugins:
          - docker#v3.7.0:
              image: node:22.15.0
              mount-buildkite-agent: false
      - label: ":jest: Jest {{matrix}} OTel compatibility"
        matrix:
          - "27.5.1"
          - "29.7.0"
          - "30.5.2"
        command:
          - "cd test-collector-javascript"
          - "npm pkg set 'devDependencies.jest={{matrix}}' --workspace examples/jest"
          - "npm install --ignore-scripts --legacy-peer-deps"
          - "npm test -- --runInBand e2e/jest-otel.test.js"
        plugins:
          - docker#v3.7.0:
              image: node:22.15.0
              mount-buildkite-agent: false
      - label: ":vitest: Vitest {{matrix}} compatibility"
        matrix:
          - "1.6.1"
          - "2.1.9"
          - "3.0.0"
          - "4.0.18"
          - "4.1.0"
        command:
          - "cd test-collector-javascript"
          - "npm pkg set 'devDependencies.vitest={{matrix}}' --include-workspace-root --workspace examples/vitest"
          - "npm install --ignore-scripts --legacy-peer-deps"
          - "npm test -- --runInBand e2e/vitest.test.js"
        plugins:
          - docker#v3.7.0:
              image: node:22.15.0
              mount-buildkite-agent: false
